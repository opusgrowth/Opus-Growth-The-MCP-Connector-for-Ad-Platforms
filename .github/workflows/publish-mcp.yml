name: Publish to MCP Registry

# Resmî MCP Registry'ye (registry.modelcontextprotocol.io) otomatik yayın.
# Kimlik doğrulama GitHub Actions OIDC ile yapılır — depoda saklanan sır YOKTUR.
# OIDC, io.github.<owner>/* ad alanının sahipliğini kanıtlar; server.json'daki
# "name" alanı bu yüzden io.github.opusgrowth/ads-mcp olmalıdır.

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC jetonu üretmek için ŞART
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate server.json (fail fast, before publishing)
        run: |
          python3 - <<'PY'
          import json, sys, urllib.parse
          d = json.load(open("server.json"))
          errs = []
          desc = d.get("description", "")
          if len(desc) > 100:
              errs.append(f"description is {len(desc)} chars; registry limit is 100")
          if not d.get("name", "").startswith("io.github.opusgrowth/"):
              errs.append("name must start with io.github.opusgrowth/ (GitHub OIDC only proves that namespace)")
          if not d.get("version"):
              errs.append("version is required")
          for r in d.get("remotes", []):
              u = urllib.parse.urlparse(r.get("url", ""))
              if u.scheme != "https":
                  errs.append(f"remote url must be https: {r.get('url')}")
          if errs:
              print("server.json validation failed:")
              for e in errs:
                  print("  -", e)
              sys.exit(1)
          print(f"server.json OK - {d['name']} v{d['version']} ({len(desc)}/100 chars)")
          PY

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
