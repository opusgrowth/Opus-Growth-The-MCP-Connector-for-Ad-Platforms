name: Publish to MCP Registry

# Resmî MCP Registry'ye (registry.modelcontextprotocol.io) otomatik yayın.
# Kimlik doğrulama GitHub Actions OIDC ile yapılır — depoda saklanan sır YOKTUR.
# OIDC yalnızca io.github.<owner>/* ad alanının sahipliğini kanıtlar; server.json'daki
# "name" bu yüzden io.github.opusgrowth/ads-mcp olmalıdır.
#
# YENİ SÜRÜM YAYINLAMAK: server.json içindeki "version" alanını yükselt ve push et.
# Sürüm değişmediyse iş akışı yayını ATLAR — registry aynı sürümü reddediyor
# ("cannot publish duplicate version"), boru hattı gereksiz yere kırmızıya düşmesin.

on:
  push:
    branches: [main]
    paths:
      - server.json
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC jetonu üretmek için ŞART
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate server.json (fail fast, before publishing)
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.parse
          d = json.load(open("server.json"))
          errs = []
          desc = d.get("description", "")
          if len(desc) > 100:
              errs.append(f"description is {len(desc)} chars; registry limit is 100")
          if not d.get("name", "").startswith("io.github.opusgrowth/"):
              errs.append("name must start with io.github.opusgrowth/ (GitHub OIDC only proves that namespace)")
          if not d.get("version"):
              errs.append("version is required")
          for r in d.get("remotes", []):
              u = urllib.parse.urlparse(r.get("url", ""))
              if u.scheme != "https":
                  errs.append(f"remote url must be https: {r.get('url')}")
          if errs:
              print("server.json validation failed:")
              for e in errs:
                  print("  -", e)
              sys.exit(1)
          print(f"server.json OK - {d['name']} v{d['version']} ({len(desc)}/100 chars)")
          EOF

      - name: Check whether this version is already published
        id: check
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          local = json.load(open("server.json"))
          name, version = local["name"], local["version"]
          try:
              url = "https://registry.modelcontextprotocol.io/v0/servers?search=" + name.split("/")[0]
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
              published = {
                  (s.get("server") or {}).get("version")
                  for s in data.get("servers", [])
                  if (s.get("server") or {}).get("name") == name
              }
          except Exception as e:            # registry unreachable -> attempt the publish anyway
              print(f"registry lookup failed ({e}) - will try to publish")
              published = set()
          needed = version not in published
          print(f"{name} v{version}: " + ("publishing" if needed else "already published, skipping"))
          # $GITHUB_OUTPUT accepts ONLY key=value lines - never write comments/messages here.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"needed={'true' if needed else 'false'}\n")
          EOF

      - name: Install mcp-publisher
        if: steps.check.outputs.needed == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Authenticate (GitHub OIDC)
        if: steps.check.outputs.needed == 'true'
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.check.outputs.needed == 'true'
        run: mcp-publisher publish

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needed }}" = "true" ]; then
            echo "Published a new version to the MCP Registry." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Version unchanged - nothing to publish (registry entry stays live)." >> "$GITHUB_STEP_SUMMARY"
          fi
